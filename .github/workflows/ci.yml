name: CI

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# go.mod keeps `replace github.com/lexfrei/pogo-pvp-engine => ../pogo-pvp-engine`
# for local development. CI checks out both repos into sibling directories
# under GITHUB_WORKSPACE and runs every go step with working-directory set to
# the MCP checkout so the relative replace resolves. Remove once the engine is
# published to proxy.golang.org and the replace directive can drop.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: pogo-pvp-mcp

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: lexfrei/pogo-pvp-engine
          path: pogo-pvp-engine

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: pogo-pvp-mcp/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.12.2
          working-directory: pogo-pvp-mcp

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: pogo-pvp-mcp

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: lexfrei/pogo-pvp-engine
          path: pogo-pvp-engine

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: pogo-pvp-mcp/go.mod

      - name: Run tests
        working-directory: pogo-pvp-mcp
        run: go test -race -count=1 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: pogo-pvp-mcp

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: lexfrei/pogo-pvp-engine
          path: pogo-pvp-engine

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: pogo-pvp-mcp/go.mod

      - name: Build binary
        working-directory: pogo-pvp-mcp
        run: go build -o /dev/null ./cmd/pogo-pvp-mcp
